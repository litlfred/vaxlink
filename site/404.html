<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VaxLink is now the journeys</title>
    <link rel="canonical" href="https://litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/" />
    <script>
      // The old app's hash routes (#/walkthrough/J2b, #/demo/S4, #/how/gdhcn) are
      // path routes of the journeys viewer's workshop; a meta refresh would drop them.
      (function () {
        var root = 'https://litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/';
        var workshop = root + 'smart-trust-demo/workshops/dpi-h-policy-track/';
        var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
        var views = ['overview', 'walkthrough', 'demo', 'how', 'map'];
        var target = root;
        if (parts.length && views.indexOf(parts[0]) >= 0) {
          target = workshop + parts.map(encodeURIComponent).join('/') + '/';
        }
        location.replace(target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/" />
  </head>
  <body>
    <p>The VaxLink walkthrough is now the journeys of the SMART Trust demonstrator:
      <a href="https://litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/">litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/</a>.</p>
  </body>
</html>
