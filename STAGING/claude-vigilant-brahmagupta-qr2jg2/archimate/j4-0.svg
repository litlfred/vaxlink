<g class="av-legend"><rect x="14" y="464" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="482">Key</text><text class="av-keyh" x="24" y="498">Colour: which part of the architecture a box belongs to</text><rect x="24" y="507" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="518">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="24" y="527" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="538">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="24" y="547" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="558">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="24" y="578">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="24" y="586" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="602">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="24" y="616" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="632">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="658">Other marks</text><rect x="24" y="665" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="670" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="678">A box inside another box: a part of it</text><rect x="24" y="687" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="687" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="698">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="24" y="718">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M34 734 L66 734" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="738">Realization: makes real, or achieves</text><path d="M34 754 L66 754" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="758">Serving: serves (provides what the end needs)</text><path d="M34 774 L66 774" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="778">Assignment: is assigned to, or carries out</text><path d="M34 794 L66 794" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="798">Specialization: is a kind of</text></g></svg>
