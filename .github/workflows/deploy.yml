name: Deploy to GitHub Pages

# The walkthrough is now the journeys viewer of litlfred/smart-trust-demo, at
# https://litlfred.github.io/smart-trust-demo/en/smart-trust-demo/journeys/.
# What is left here is the redirect: scripts/publish-gh-pages.sh puts site/
# (index.html, 404.html) at the root of gh-pages, which Pages serves. Only main
# publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Push the redirect to gh-pages
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: sh scripts/publish-gh-pages.sh
