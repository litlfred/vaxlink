<g class="av-legend"><rect x="14" y="583" width="829" height="354" fill="#fafafa" stroke="#bbb"/><text class="av-keyt" x="24" y="601">Key</text><text class="av-keyh" x="24" y="617">Colour: which part of the architecture a box belongs to</text><rect x="24" y="626" width="44" height="14" fill="#f5deaa" stroke="#877a5e"/><text class="av-key" x="82" y="637">Strategy: what the organisation is able to do (capabilities) and with what (resources, value streams)</text><rect x="24" y="646" width="44" height="14" fill="#ffffb5" stroke="#8c8c64"/><text class="av-key" x="82" y="657">Business: people, roles and organisations, the processes they carry out and the information they use</text><rect x="24" y="666" width="44" height="14" fill="#b5ffff" stroke="#648c8c"/><text class="av-key" x="82" y="677">Software: systems and their parts, the services they offer, and the data they hold</text><text class="av-keyh" x="24" y="697">Shape: what kind of thing a box is (its small italic label names the exact kind)</text><rect x="24" y="705" width="44" height="24" rx="8" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="721">Rounded corners: something done or an ability, such as a capability, process or function</text><rect x="24" y="735" width="44" height="24" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="751">Square corners: something that exists, such as a system, a role, or a piece of data</text><text class="av-keyh" x="24" y="777">Other marks</text><rect x="24" y="784" width="44" height="18" fill="#fff" stroke="#555"/><rect x="34" y="789" width="24" height="9" fill="#fff" stroke="#555"/><text class="av-key" x="82" y="797">A box inside another box: a part of it</text><rect x="24" y="806" width="44" height="14" rx="3" fill="#d3ffff" stroke="#709e9e"/><rect x="24" y="806" width="44" height="5" fill="#4c6b6b"/><text class="av-key" x="82" y="817">Band with a dark header: a grouping for layout only; it adds no meaning (tinted in the layer most of its boxes belong to)</text><text class="av-keyh" x="24" y="837">Line: how two boxes are related, read from where the line starts to where it ends</text><path d="M34 853 L66 853" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="857">Realization: makes real, or achieves</text><path d="M34 873 L66 873" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-open)"/><text class="av-key" x="82" y="877">Serving: serves (provides what the end needs)</text><path d="M34 893 L66 893" fill="none" stroke="#333" stroke-width="1.2" marker-start="url(#dot)" marker-end="url(#arrow-filled)"/><text class="av-key" x="82" y="897">Assignment: is assigned to, or carries out</text><path d="M34 913 L66 913" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#triangle-hollow)"/><text class="av-key" x="82" y="917">Specialization: is a kind of</text></g></svg>
